<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div id="sync-status-bar" class="sync-status-bar" role="status" aria-live="polite"></div>
<div class="dashboard-shell">
    <div class="top-bar" role="banner">
        <div class="brand">
            <img src="/Images/S-Logo.png" width="40" height="40" alt="MimeaHub logo">
            <span>MimeaHub</span>
        </div>
    </div>

    <main class="content" role="main">
        <h1 style="margin-bottom: 20px;">Analytics</h1>

        <div class="card">
            <h3 style="margin-bottom: 15px;">Crop Health Overview</h3>
            <div id="analytics-summary" style="display: grid; gap: 16px;"></div>
        </div>

        <div class="card">
            <h3>Disease Trend</h3>
            <div id="analytics-chart" style="display: grid; gap: 16px; max-height: 360px; overflow:auto;"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="window.location.href='scan.html'"><span>📸</span>Scan</div>
        <div class="nav-item" onclick="window.location.href='map.html'"><span>🗺️</span>Map</div>
        <div class="nav-item" onclick="window.location.href='history.html'"><span>📜</span>History</div>
        <div class="nav-item" onclick="window.location.href='analytics.html'"><span>📊</span>Stats</div>
        <div class="nav-item" onclick="window.location.href='market.html'"><span>🏪</span>Market</div>
    </div>
    </div>
    <script src="analytics.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
                    .then(reg => {
                        console.log('SW registered:', reg.scope);
                        if (reg.waiting) {
                            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });
                    })
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
